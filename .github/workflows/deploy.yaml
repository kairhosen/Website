# Déploiement automatique du site vers IONOS par SFTP (FTP chiffré par SSH).
# À placer dans le dépôt : .github/workflows/deploy.yml
# Se lance à chaque push sur main, ou à la main (onglet Actions > Déployer > Run workflow).

name: Déployer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Bloque le déploiement si les vérifications du site échouent.
      - name: Vérifier le site
        run: node tools/check.js

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Envoie tout le site en écrasant les fichiers existants.
      # Les fichiers présents uniquement sur le serveur ne sont pas supprimés.
      # Les fichiers internes (outils, notes, git) ne sont pas envoyés.
      - name: Transférer par SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR || '/' }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "sftp://$FTP_SERVER" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          mirror -R --overwrite --parallel=4 --verbose \
            --exclude-glob .git* \
            --exclude-glob .github/ \
            --exclude-glob tools/ \
            --exclude-glob CLAUDE.md \
            --exclude-glob README.md \
            --exclude-glob .nojekyll \
            ./ "$FTP_DIR"
          bye
          LFTP
